name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q
      - name: The installed command works
        shell: bash
        env:
          BILLWISE_DB: ${{ runner.temp }}/ci.db
        run: |
          billwise --version
          billwise client add "CI Client"
          billwise invoice new "CI Client" -l "Test work | 2 | 50 | 10" --issue
          billwise pay 1
          billwise report owed
